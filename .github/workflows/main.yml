name: Build mod

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unzip the project
        run: unzip -q -o mod-project.zip

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.10.2

      - name: Build the jar
        working-directory: bionicexpansion
        run: gradle build --no-daemon

      - name: Check the mod is complete
        run: unzip -l bionicexpansion/build/libs/bionicexpansion-1.0.0.jar | grep neoforge.mods.toml

      - uses: actions/upload-artifact@v4
        with:
          name: bionicexpansion-jar
          path: bionicexpansion/build/libs/bionicexpansion-*.jar
